services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
      - backend-node_modules:/app/backend/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/document-management
      - JWT_EXPIRE=30d
      - JWT_COOKIE_EXPIRE=30
      - NODE_ENV=development
      - PORT=5000
      - SCANNER_ENABLED=false
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - web-node_modules:/app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-node_modules:
  web-node_modules:
