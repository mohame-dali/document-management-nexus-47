# /etc/nginx/sites-available/dms.nginx.conf
# Configuration Nginx optimisée pour l'application DMS (Production Ubuntu)
# Supporte HTTP -> HTTPS, WebSockets (Socket.IO), uploads 50MB et timeouts IA étendus (300s).

# 1. Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dms.local; # Remplacer par votre nom de domaine ou IP

    # Nécessaire pour le renouvellement Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur Principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dms.local; # Remplacer par votre nom de domaine ou IP

    # Certificats SSL (Certbot ou auto-signés)
    ssl_certificate /etc/letsencrypt/live/dms.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dms.local/privkey.pem;

    # Paramètres SSL durcis
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Taille maximale des téléversements (scans haute résolution, pièces jointes PDF)
    client_max_body_size 50M;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Racine pour les fichiers statiques du frontend Vite React
    root /var/www/dms/dist;
    index index.html;

    # 3. Fichiers téléversés (Uploads Multer)
    location /uploads/ {
        alias /var/www/dms/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 4. API Backend (Node.js / Express sur port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts étendus pour l'inférence IA locale (GGUF ALLaM 7B / OCR volumineux)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Désactiver le buffering pour le streaming IA
        proxy_buffering off;
    }

    # 5. Support WebSocket (Socket.IO pour notifications et chat en temps réel)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 6. Documentation Swagger
    location /api-docs {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 7. Routage SPA Frontend (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressif pour les assets Vite hashés
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
