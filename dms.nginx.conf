# ==============================================================================
# Configuration Nginx de Production — DMS (Gestion Électronique des Courriers & RH)
# Fichier cible : /etc/nginx/sites-available/dms
# ==============================================================================

# Redirection globale HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Défi ACME pour le renouvellement automatique Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirection permanente vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur Sécurisé HTTPS (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # --------------------------------------------------------------------------
    # Certificats SSL (Générés par Certbot / Let's Encrypt)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Paramètres de durcissement TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # En-têtes de Sécurité HTTP
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Tailles d'Upload & Timeouts
    # --------------------------------------------------------------------------
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Racine du Frontend React (fichiers statiques compilés via `npm run build`)
    root /var/www/dms/dist;
    index index.html;

    # Compression Gzip des assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Assets Frontend compilés (JS, CSS, images avec hash de version)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 2. Reverse Proxy vers l'API Backend Node.js (Port 5000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        # En-têtes de transmission d'IP et de protocole réels
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts adaptés pour les traitements lourds (OCR, résumé IA, etc.)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 3. WebSockets (Socket.IO pour notifications et scanners réseau)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;

        # En-têtes obligatoires pour la mise à niveau WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 4. Fichiers protégés & Uploads servis par le backend
    # --------------------------------------------------------------------------
    location ~* ^/(courrier|uploads)/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 5. Routage SPA React (Fallback vers index.html pour les routes clientes)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
