<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Système de Gestion du Courrier</title>
    <meta name="description" content="Application professionnelle de gestion et suivi du courrier et des documents administratifs conçue pour une utilisation quotidienne intensive." />
    <meta property="og:title" content="Système de Gestion du Courrier" />
    <meta property="og:description" content="Application professionnelle de gestion et suivi du courrier et des documents administratifs conçue pour une utilisation quotidienne intensive." />
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('dms-language');
          if (lang !== 'ar' && lang !== 'fr') lang = 'ar';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {
          document.documentElement.setAttribute('lang', 'ar');
          document.documentElement.setAttribute('dir', 'rtl');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
